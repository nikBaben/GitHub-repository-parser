[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-parser"
version = "0.1.0"
description = "GitHub repository analytics parser and Plotly dashboard builder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.20,<7.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = [
    "parser*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
